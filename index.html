<style>

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--pix); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: relative; height: 100%; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }

.score { font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: .9; font-variant-numeric: tabular-nums; }
.sub { font-size: 14px; color: var(--hot); margin-top: 4px; }
.time { font-weight: 700; font-size: clamp(26px, 7vw, 40px); line-height: 1; font-variant-numeric: tabular-nums; text-align: center; }

.time.bonus { color: var(--hot); transform: scale(1.25); transition: transform .15s steps(3); }
.tools { display: flex; gap: 8px; justify-self: end; }
.icon { width: 40px; height: 40px; border-radius: 0; border: 2px solid var(--ink); background: rgba(42, 27, 46, .7); color: var(--ink); font: 700 13px var(--pix); display: grid; place-items: center; cursor: pointer; box-shadow: 3px 3px 0 #2a1b2e; text-shadow: none; }

.icon.off .wave { display: none; }
.icon:not(.off) .cross { display: none; }
.icon:focus-visible, .btn:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
#intro { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 28px; background: #2a1b2e; background-image: linear-gradient(rgba(255,255,255,.04) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.04) 2px, transparent 2px); background-size: 16px 16px; cursor: pointer; transition: opacity .6s steps(6); }
#intro.out { opacity: 0; pointer-events: none; }
#intro p { margin: 0; max-width: 16em; text-align: center; font-weight: 700; font-size: clamp(26px, 7.5vw, 44px); line-height: 1.2; color: var(--hot); text-shadow: 3px 3px 0 #7d2e2a; }

.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); pointer-events: none; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 130px; min-height: 50px; border-radius: 0; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 700 17px var(--pix); cursor: pointer; padding: 0 14px; box-shadow: 3px 3px 0 #140c16; }

<script>"use strict";
const Shell = (() => {
    const store = {
        get(k, d) { try {
            const v = localStorage.getItem(k);
            return v === null ? d : JSON.parse(v);
        }
        catch (e) {
            return d;
        } },
        set(k, v) { try {
            localStorage.setItem(k, JSON.stringify(v));
        }
        catch (e) { } }
    };
    function hash(str) {
        let h = 1779033703 ^ str.length;
        for (let i = 0; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = (h << 13) | (h >>> 19);
        }
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^ (h >>> 16)) >>> 0;
    }
    function rng(seed) {
        let a = seed >>> 0;
        return () => {
            a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const today = () => iso(new Date());
    const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
    function dayNumber() {
        const d = new Date();
        return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2026, 9, 1)) / 864e5) + 1;
    }
    const dailySeed = game => rng(hash(game + ':' + today()));
    function dailyInfo(game) {
        const s = store.get(game + ':daily', {});
        const alive = s.last === today() || s.last === yesterday();
        return { playedToday: s.last === today(), official: s.last === today() ? s.official : null, streak: alive ? (s.streak || 0) : 0, maxStreak: s.maxStreak || 0 };
    }
    function recordDaily(game, score) {
        const key = game + ':daily';
        const s = store.get(key, {});
        const t = today();
        let first = false;
        if (s.last !== t) {
            first = true;
            s.streak = s.last === yesterday() ? (s.streak || 0) + 1 : 1;
            s.maxStreak = Math.max(s.maxStreak || 0, s.streak);
            s.last = t;
            s.official = score;
        }
        store.set(key, s);
        return { first, official: s.official, streak: s.streak };
    }
    const LANGS = ['es', 'ca', 'en'];
    const nav = (navigator.language || 'es').toLowerCase();

    if (!LANGS.includes(lang))
        lang = 'es';
    const dict = { es: {}, ca: {}, en: {} };
    function addStrings(d) { LANGS.forEach(l => Object.assign(dict[l], d[l] || {})); }
    function t(k, vars) {
        let s = (dict[lang] && dict[lang][k]) || dict.es[k] || k;
        if (vars)
            for (const v in vars)
                s = s.split('{' + v + '}').join(vars[v]);
        return s;
    }
    function applyI18n() {
        document.documentElement.lang = lang === 'ca' ? 'ca-ES-valencia' : lang;
        document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    }
    function toggleLang() { lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]; store.set('lang', lang); applyI18n(); return lang; }

    function ensureAudio() {
        if (!ctx) {
            try {

            }
            catch (e) {

            }
        }
        if (ctx && ctx.state === 'suspended')

    }
    function tone(freq, dur = 0.12, type = 'sine', vol = 0.14, slide = 0, delay = 0) {
        if (muted || !ctx)
            return;

        g.connect(ctx.destination);

    const PENTA = [0, 2, 4, 7, 9];
    const note = (base, step) => base * Math.pow(2, (PENTA[step % 5] + 12 * Math.floor(step / 5)) / 12);

    }
    catch (e) { } }

        }

        }

        es: { copied: '¡Copiado!', sound: 'Sonido', language: 'Idioma', home: 'Todos los juegos' },
        ca: { copied: 'Copiat!', sound: 'So', language: 'Idioma', home: 'Tots els jocs' },

        paint();
    }

        try {
            if (/^(localhost|127\.|\[::1\])/.test(location.hostname))
                return;
            const sc = document.createElement('script');
            sc.async = true;
            sc.dataset.goatcounter = 'https://alabcar.goatcounter.com/count';
            sc.src = 'https://gc.zgo.at/count.js';
            document.head.appendChild(sc);
        }
        catch (e) { }
    })();
    function track(name) {
        try {
            if (window.goatcounter && window.goatcounter.count)
                window.goatcounter.count({ path: 'jugar/' + name, title: 'Partida: ' + name, event: true });
        }
        catch (e) { }
    }

    const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
    const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

        get lang() { return lang; }, ensureAudio, tone, note, buzz, isMuted, toggleMute, share, wireControls, track, lerp, easeOutCubic, easeOutBack };
})();</script>
